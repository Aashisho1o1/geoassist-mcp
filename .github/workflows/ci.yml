name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # The live demo runs the compiled server modules committed in docs/lib.
      # Fail if they no longer match what src/ builds to.
      - run: npm run build:demo
      - run: git diff --exit-code -- docs/lib
